<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنكك - تسجيل الدخول</title>
    <style>
        :root {
            --primary: #d91c24;
            --primary-dark: #a81219;
            --bg-light: #f4f6f9;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .phone-frame {
            width: 100%;
            max-width: 390px;
            background: #ffffff;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.12);
            border: 1px solid var(--border);
        }

        .top-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #ffffff;
            padding: 32px 24px 28px;
            text-align: center;
        }

        .brand-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.18);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            margin-bottom: 12px;
            letter-spacing: 0.3px;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .brand-sub {
            font-size: 13px;
            opacity: 0.9;
        }

        .form-container {
            padding: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            color: var(--text-dark);
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: background-color 0.2s;
        }

        .btn-login:hover {
            background-color: var(--primary-dark);
        }

        .error-box {
            display: none;
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            font-size: 13px;
            text-align: center;
        }

        .quick-tools {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 1px dashed var(--border);
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            text-align: center;
        }

        .tool-item {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 6px;
            font-size: 11px;
            color: var(--text-dark);
            font-weight: 600;
        }

        .demo-hint {
            margin-top: 16px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div class="top-header">
        <div class="brand-badge">نموذج واجهة تجريبي</div>
        <div class="brand-title">بنكك</div>
        <div class="brand-sub">مرحباً بك، أدخل بياناتك للم
